<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniTrack AI - ตารางกำหนดการ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="mainstyle.css">
</head>

<body>

    <!-- Header -->
    <header class="app-header">
        <div class="header-brand">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>UniTrack AI</span>
        </div>
        <div class="header-nav-actions">
            <a href="assistant.html" class="nav-link-btn">
                <i class="fa-solid fa-robot"></i> หน้าผู้ช่วย AI
            </a>
            <span class="divider">|</span>
            <a href="index.html" class="text-btn">ออกจากระบบ</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <div class="schedule-header-banner">
            <div>
                <h2>ตารางกำหนดการสมัครมหาวิทยาลัย</h2>
                <p>รวบรวมวันสำคัญ วันเปิด-ปิดรับสมัคร และวันสอบสัมภาษณ์ของคุณ</p>
            </div>
            <button class="primary-btn">
                <i class="fa-solid fa-plus"></i> เพิ่มกำหนดการใหม่
            </button>
        </div>

        <!-- Schedule List Sample -->
        <div class="schedule-list">
            <div class="schedule-card วันเปิดรับสมัคร">
                <div class="schedule-info">
                    <div class="schedule-uni-info">จุฬาลงกรณ์มหาวิทยาลัย | คณะวิศวกรรมศาสตร์</div>
                    <h4>TCAS รอบที่ 1 Portfolio</h4>
                    <div class="schedule-meta">
                        <span><i class="fa-regular fa-calendar"></i> วันที่: 2026-12-01</span>
                        <span class="badge">วันเปิดรับสมัคร</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
